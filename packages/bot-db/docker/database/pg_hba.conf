# Kernel-verified Unix peer identities only. The host lifecycle runs as the
# postgres OS user inside this container; PostgREST's OS user maps only to
# authenticator and only for the live Bot database. Candidate, source and
# retired databases are unreachable through REST.
local   all            postgres        peer
local   devryan_bots   authenticator   peer map=devryan_rest
local   all            all             reject
host    all            all             0.0.0.0/0   reject
host    all            all             ::/0        reject
