# DevRyan local Bot database. Root-owned and read-only inside the image.
data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/devryan-bot-database/pg_hba.conf'
ident_file = '/etc/devryan-bot-database/pg_ident.conf'

# Socket only: no TCP listener. The socket volume is shared with the REST
# container alone, and the socket is limited to the postgres group.
listen_addresses = ''
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
max_connections = 40
superuser_reserved_connections = 3

shared_buffers = 64MB
work_mem = 8MB
maintenance_work_mem = 64MB
dynamic_shared_memory_type = posix
huge_pages = off

# Durability.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 5min

# Logging never records statements, bind parameters or error context. Errors
# keep their primary message only (terse), and an error never echoes the
# statement that raised it.
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = panic
log_error_verbosity = terse
log_statement = 'none'
log_duration = off
log_min_duration_statement = -1
log_min_duration_sample = -1
log_transaction_sample_rate = 0
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
log_lock_waits = off
log_temp_files = -1
log_autovacuum_min_duration = -1
log_checkpoints = off
log_replication_commands = off
log_statement_stats = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off
debug_print_parse = off
debug_print_rewritten = off
debug_print_plan = off
log_line_prefix = '%m [%p] '
log_timezone = 'UTC'
track_activity_query_size = 1024
compute_query_id = off

timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
password_encryption = scram-sha-256
ssl = off
