# cargo-deny policy for the product's Cargo workspace (packages/native/DOCUMENTATION.md).
# Run: node scripts/check-native.mjs --deny   (cargo-deny 0.20.2)

[graph]
all-features = false

[advisories]
# Every RustSec advisory that affects a crate in the graph fails the check
# (CI: node scripts/check-native.mjs --advisories, on a fresh database).
# An advisory is ignored only deliberately, here, one inline table each with
# the reason it does not apply or why it must wait:
#   { id = "RUSTSEC-YYYY-NNNN", reason = "..." },
# scripts/check-native.test.mjs refuses an entry without a reason.
version = 2
ignore = []

[licenses]
version = 2
# Permissive licences only: nothing GPL, AGPL or LGPL; MPL only if
# unavoidable and named here with the crate that needs it.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: an allowed licence no crate uses is fine.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates (publish = false) are checked under the repository's MIT licence.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
