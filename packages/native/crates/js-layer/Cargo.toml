[package]
name = "devryan-js-layer"
version = "0.1.0"
description = "The native ledger's JavaScript job-order layer and JavaScript value/JSON/string semantics, compiled by path from their own files for the scheduler crates (tests only; nothing calls it yet)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The two modules are the ledger's own files, included by path (src/lib.rs):
# their unit tests need the ledger's crates and run there, so this crate has
# no test target of its own.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]

[lints]
workspace = true
