# The ledger's text diff, built to WebAssembly for lib/ledger-core.js.
# No dependencies of any kind. Rebuild with `node scripts/build-ledger-core.mjs`
# (packages/harness-runtime/DOCUMENTATION.md, "Rust ledger core").
[package]
name = "ledger-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib: the WebAssembly module; rlib: lets `cargo test` link the integration tests.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false
overflow-checks = false
