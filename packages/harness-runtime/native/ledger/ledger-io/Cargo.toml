[package]
name = "ledger-io"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Builds the test-only `atomic-probe` and `odb-probe` binaries, which the
# Node differential tests drive (scripts/ledger-native/). Never packaged,
# never shipped.
probe = []

[[bin]]
name = "atomic-probe"
path = "src/bin/atomic-probe.rs"
required-features = ["probe"]

[[bin]]
name = "odb-probe"
path = "src/bin/odb-probe.rs"
required-features = ["probe"]

[dependencies]
# Exactly pinned: the system calls libuv makes (F_FULLFSYNC, close$NOCANCEL,
# utimensat, statfs, kill, getentropy) that std does not expose.
libc = "=0.2.191"
# JavaScript strings, numbers and JSON, for the lock file's bytes.
ledger-core = { path = "../../ledger-core" }
# Git's object ids (sha1 and sha256 repositories) and zlib (loose and packed
# objects), for `git::odb` (research file 28, section 6). Exactly pinned,
# default features off where they add crates the reader does not use.
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
