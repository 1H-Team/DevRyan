name: Verify native release inputs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-native-release-inputs
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact native dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile --cpu '*' --os darwin
      - name: Build and verify native v2 runtime
        run: bun scripts/build-native-runtime.mjs
