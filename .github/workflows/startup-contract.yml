name: Startup contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  startup-contract:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic test dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - name: Test startup contracts on every PR
        run: bun run test:startup
