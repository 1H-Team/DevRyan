name: CI

# The full deterministic suite on every push to main and every pull request.
# Locally, `bun run validate` is the fast gate; this runs `bun run validate:full`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # DevRyan ships for macOS only; native runtime tests use darwin-arm64 binaries.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore reviewed Claude executable
        # Gitignored; native runtime input tests verify it like the release build does.
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Build and verify native v2 runtime
        # Native graph tests run the real session-execution launcher from packages/web/runtime.
        timeout-minutes: 20
        run: bun scripts/build-native-runtime.mjs
      - name: Build
        run: bun run build
      - name: Lint, type-check, test, docs and bundle budgets
        run: bun run validate:full

  startup:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - name: Runtime bundle, ledger, migration and Electron startup contracts
        run: bun run test:startup
