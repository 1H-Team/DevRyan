name: CI

# One Ubuntu build, four portable workers and two native macOS workers.
# validate:full remains the equivalent complete local gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - name: Restore reviewed Claude executable
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Lint, types, docs, build and bundle budgets
        run: node scripts/validate.mjs checks
      - uses: actions/upload-artifact@v4
        with:
          name: ci-built-assets
          include-hidden-files: true
          path: |
            packages/web/dist/
            packages/electron/resources/web-dist/
            packages/electron/dist-bundle/
          if-no-files-found: error
          retention-days: 1

  tests:
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: portable-1
            runner: ubuntu-latest
            concurrency: '2'
          - lane: portable-2
            runner: ubuntu-latest
            concurrency: '2'
          - lane: portable-3
            runner: ubuntu-latest
            concurrency: '2'
          - lane: portable-4
            runner: ubuntu-latest
            concurrency: '2'
          - lane: native-1
            runner: macos-26
            concurrency: '2'
          - lane: native-2
            runner: macos-26
            concurrency: '2'
    env:
      DEVRYAN_TEST_CONCURRENCY: ${{ matrix.concurrency }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ci-built-assets
          path: packages
      - name: Restore reviewed Claude executable
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Build and verify native v2 runtime
        if: ${{ matrix.runner == 'macos-26' }}
        timeout-minutes: 20
        run: bun scripts/build-native-runtime.mjs
      - name: Run every suite assigned to this lane and check scratch cleanup
        run: node scripts/validate.mjs ci:${{ matrix.lane }}
