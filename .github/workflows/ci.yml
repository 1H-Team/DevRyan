name: CI

# The full deterministic suite on every push to main and every pull request.
# Locally, `bun run validate` is the fast gate; this runs `bun run validate:full`,
# which builds once, then runs every suite (including every startup-contract file,
# see scripts/test-startup-contract.mjs) as one bounded concurrent pool.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # DevRyan ships for macOS only; native runtime tests use darwin-arm64 binaries.
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        # The Electron install-time prepare (web assets, native helpers, ABI
        # rebuild) is packaging input; validate:full builds what the suites use.
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - name: Restore reviewed Claude executable
        # Gitignored; native runtime input tests verify it like the release build does.
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Build and verify native v2 runtime
        # Native graph tests run the real session-execution launcher from packages/web/runtime.
        timeout-minutes: 20
        run: bun scripts/build-native-runtime.mjs
      - name: Lint, type-check, docs, build, bundle budgets and every test suite
        run: bun run validate:full
