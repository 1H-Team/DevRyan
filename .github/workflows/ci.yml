name: CI

# One build, then every deterministic suite on isolated macOS runners.
# validate:full remains the equivalent complete local gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - name: Restore reviewed Claude executable
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Lint, types, docs, build and bundle budgets
        run: node scripts/validate.mjs checks
      - uses: actions/upload-artifact@v4
        with:
          name: ci-built-assets
          path: |
            packages/web/dist/
            packages/electron/resources/web-dist/
            packages/electron/dist-bundle/
          if-no-files-found: error
          retention-days: 1

  tests:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: web
            concurrency: '1'
          - lane: harness
            concurrency: '1'
          - lane: core
            concurrency: '2'
    env:
      DEVRYAN_TEST_CONCURRENCY: ${{ matrix.concurrency }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ci-built-assets
          path: packages
      - name: Restore reviewed Claude executable
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Build and verify native v2 runtime
        timeout-minutes: 20
        run: bun scripts/build-native-runtime.mjs
      - name: Run every suite assigned to this lane and check scratch cleanup
        run: node scripts/validate.mjs ci:${{ matrix.lane }}
