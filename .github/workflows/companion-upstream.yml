name: Companion upstream check

# Rebuild the DevRyan companion only when an OpenCode release needs it: report
# whether the reviewed patch still applies to the latest upstream release.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: Upstream tag to check (defaults to the latest release)
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check companion patch against upstream
        env:
          RELEASE: ${{ inputs.release }}
        run: node scripts/companion-upstream-check.mjs ${RELEASE:+--release "$RELEASE"}
