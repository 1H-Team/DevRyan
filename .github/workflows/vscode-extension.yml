name: Publish VS Code Extension

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing tag to attach the VSIX to (e.g., v1.1.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.release_tag || github.ref }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.inputs.release_tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build VS Code extension
        run: bun run --cwd packages/vscode build

      - name: Package extension
        run: cd packages/vscode && bunx vsce package --no-dependencies

      - name: Verify packaged VSIX orchestration config
        run: |
          set -euo pipefail
          VSIX=$(find packages/vscode -maxdepth 1 -type f -name '*.vsix' -print -quit)
          test -n "$VSIX"
          EXTRACT_ROOT="$RUNNER_TEMP/devryan-vsix"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          unzip -q "$VSIX" -d "$EXTRACT_ROOT"
          ARTIFACT_ROOT="$EXTRACT_ROOT/extension/dist/default-config"
          node scripts/verify-default-config-artifact.mjs \
            --source packages/web/server/default-config \
            --artifact-root "$ARTIFACT_ROOT"
          node scripts/smoke-packaged-orchestration-config.mjs --config-root "$ARTIFACT_ROOT"

      - name: Stage branded VSIX for GitHub uploads
        run: |
          set -euo pipefail
          mapfile -t VSIX_FILES < <(find packages/vscode -maxdepth 1 -type f -name '*.vsix' -print)
          if [ "${#VSIX_FILES[@]}" -ne 1 ]; then
            echo "Error: expected exactly one VSIX package, found ${#VSIX_FILES[@]}."
            printf '%s\n' "${VSIX_FILES[@]}"
            exit 1
          fi
          VERSION=$(node -p "require('./packages/vscode/package.json').version")
          mkdir -p artifacts
          cp "${VSIX_FILES[0]}" "artifacts/DevRyan-${VERSION}.vsix"

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: cd packages/vscode && bunx vsce publish -p "$VSCE_PAT" --no-dependencies

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: bunx ovsx publish packages/vscode/*.vsix -p "$OVSX_PAT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevRyan-vscode-vsix
          path: artifacts/*.vsix

      - name: Verify target release exists
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$RELEASE_TAG"

      - name: Attach VSIX to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*.vsix
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
