name: Publish owner-approved v2.0.9 artifact
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: 1H-Team/DevRyan
      VERSION: 2.0.9
      RELEASE_SCOPE: desktop-macos-arm64
      RELEASE_SHA256_MACOS_ARM64: 2cb0a55e3b89e87fc6dcf2b228c3cd874ae5b99b2cf3675e2c92d139bbb26760
      APPROVED_SOURCE: 88cf8599c3ce567100749dca4f2658f33db2f10e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38368339944
          name: DevRyan-macos-arm64-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38368339944
          name: DevRyan-macos-arm64-packaging
          path: packaging
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38368339944
          name: DevRyan-startup-qualification
          path: startup-evidence
      - name: Verify approved source, compiled checks, signed-image jobs and exact artifact
        run: |
          set -euo pipefail
          gh run view 38368339944 --json headSha,jobs > build-jobs.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const asset = read('packaging/macos-arm64-asset.json');
          const receipt = read('startup-evidence/DevRyan-startup-2.0.9.json');
          const jobs = read('build-jobs.json');
          const waiver = read('docs/audits/2026-10-13/release-2.0.9/release-waiver.json');
          for (const source of [asset.source, receipt.sourceCommit, jobs.headSha, waiver.sourceCommit]) assert.equal(source, process.env.APPROVED_SOURCE);
          for (const hash of [asset.sha256, receipt.dmgSha256, waiver.dmgSha256]) assert.equal(hash, process.env.RELEASE_SHA256_MACOS_ARM64);
          assert.equal(asset.name, 'DevRyan-2.0.9-arm64.dmg');
          assert.equal(asset.size, 390572156);
          assert.equal(receipt.compiledNative, 'passed');
          assert.equal(receipt.compiledQualification.cases.length, 52);
          assert.ok(receipt.compiledQualification.cases.every(row => row.status === 'passed'));
          assert.equal(receipt.compiledQualification.cleanupFailures, 0);
          for (const name of ['resolve-bot-runtime-images', 'publish-bot-runtime-images', 'verify-bot-runtime-topology']) {
            assert.equal(jobs.jobs.find(job => job.name === name)?.conclusion, 'success', name);
          }
          assert.equal(waiver.version, '2.0.9');
          assert.ok(waiver.waived.includes('ordinary-final-DMG-GUI-qualification'));
          NODE
          node scripts/verify-release-assets.mjs --directory release-assets
          test "$(gh release view v2.0.9 --json isDraft --jq .isDraft)" = true
      - name: Upload and verify the approved DMG
        run: |
          set -euo pipefail
          gh release upload v2.0.9 release-assets/DevRyan-2.0.9-arm64.dmg --clobber
          node scripts/verify-release-assets.mjs
      - name: Point the unpublished tag at the exact artifact source and publish
        run: |
          set -euo pipefail
          gh api --method PATCH repos/1H-Team/DevRyan/git/refs/tags/v2.0.9 -f sha="$APPROVED_SOURCE" -F force=true
          test "$(gh api repos/1H-Team/DevRyan/git/ref/tags/v2.0.9 --jq .object.sha)" = "$APPROVED_SOURCE"
          gh release edit v2.0.9 --draft=false --target "$APPROVED_SOURCE" --title 'DevRyan v2.0.9' --notes-file docs/audits/2026-10-13/release-2.0.9/release-notes.md
          gh release view v2.0.9 --json url,isDraft,tagName,assets
