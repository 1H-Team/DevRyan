name: Windows LPAC probes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-lpac.yml
      - packages/harness-runtime/native/session-execution-windows.c
      - packages/harness-runtime/lib/windows-private-files*
      - scripts/build-session-execution.mjs
      - scripts/diagnose-windows-supervisor-startup.mjs
      - scripts/verify-windows-host-boundary.mjs
      - scripts/verify-windows-filesystem-boundary.mjs

permissions:
  contents: read

jobs:
  startup:
    name: LPAC ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      TMPDIR: ${{ github.workspace }}/.cache/test-fixtures
      GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/.cache/test-fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Select the native SDK and disposable fixture roots
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if(process.platform!=='win32'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Native architecture required')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun -e "if(Bun.version!=='1.3.14'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Pinned native Bun required')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path $env:TMPDIR | Out-Null
          "TEMP=$env:TMPDIR" >> $env:GITHUB_ENV
          "TMP=$env:TMPDIR" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = if ($env:EXPECTED_ARCH -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $installation = & $vswhere -latest -products '*' -requires $component -property installationPath
          if (-not $installation) { throw 'Native MSVC unavailable' }
          $command = '"' + $installation + '\Common7\Tools\VsDevCmd.bat" -arch=' + $env:EXPECTED_ARCH + ' -host_arch=' + $env:EXPECTED_ARCH + ' >nul && set'
          $variables = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC environment unavailable' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Compile the exact production supervisor without acceptance
        id: supervisor
        continue-on-error: true
        run: node scripts/build-session-execution.mjs .cache/windows-native/${{ matrix.arch }}
      - name: Run exact-source Node and Bun startup probes
        if: ${{ always() && steps.supervisor.outcome == 'success' }}
        run: node scripts/diagnose-windows-supervisor-startup.mjs .cache/windows-native/${{ matrix.arch }}/supervisor-startup-diagnostic
      - name: Check private file and ACL boundaries
        if: ${{ always() && steps.supervisor.outcome == 'success' }}
        run: node scripts/verify-windows-filesystem-boundary.mjs .cache/windows-native/${{ matrix.arch }}
      - name: Check process identities and host-lifetime locks
        if: ${{ always() && steps.supervisor.outcome == 'success' }}
        run: node scripts/verify-windows-host-boundary.mjs .cache/windows-native/${{ matrix.arch }}
      - name: Require native compilation and both startup markers
        if: ${{ always() }}
        shell: pwsh
        env:
          SUPERVISOR: ${{ steps.supervisor.outcome }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          if ($env:SUPERVISOR -ne 'success') { throw 'Native LPAC compilation failed' }
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.cache/windows-native/'+process.env.EXPECTED_ARCH+'/supervisor-startup-diagnostic/result.json')); if(r.admission!==false||r.acceptance!==false||r.variants.length!==1||r.variants[0].runs.length!==2||r.variants[0].runs.some(p=>p.status!=='started'||p.receipt?.confined!==true||p.receipt.exitCode!==0))throw Error('LPAC startup failed; admission remains unavailable')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: DevRyan-windows-lpac-${{ matrix.arch }}
          path: .cache/windows-native/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
