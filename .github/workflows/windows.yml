name: Windows native qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - packages/electron/**
      - packages/harness-runtime/**
      - packages/web/server/lib/opencode/runtime-host/**
      - scripts/build-native-runtime.mjs
      - scripts/build-session-execution.mjs
      - scripts/verify-session-execution.mjs
      - scripts/native-runtime-assets.mjs
      - bun.lock

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      DEVRYAN_SKIP_INSTALL_PREPARE: '1'
      TMPDIR: ${{ github.workspace }}/.cache/test-fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Verify native host and prepare owned fixtures
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if(process.platform!=='win32'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Native runner architecture mismatch')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun -e "if(Bun.version!=='1.3.14'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Pinned native Bun required')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path $env:TMPDIR | Out-Null
          "TEMP=$env:TMPDIR" >> $env:GITHUB_ENV
          "TMP=$env:TMPDIR" >> $env:GITHUB_ENV
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Select Windows SDK compiler for the native architecture
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Windows SDK/MSVC installation unavailable' }
          $command = '"' + $installation + '\Common7\Tools\VsDevCmd.bat" -arch=' + $env:EXPECTED_ARCH + ' -host_arch=' + $env:EXPECTED_ARCH + ' >nul && set'
          $variables = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC environment unavailable' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Compile architecture-specific supervisor
        run: node scripts/build-session-execution.mjs .cache/windows-native/${{ matrix.arch }}
      - name: Qualify compiled supervision and file boundaries
        # No acceptance marker is written until the actual platform inventory
        # passes. Missing Windows read/ACL/process contracts fail this job.
        run: node scripts/build-session-execution.mjs .cache/windows-native/${{ matrix.arch }} --verify
      - name: Restore exact reviewed build inputs
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Compile and verify controller and writer on this architecture
        run: bun scripts/build-native-runtime.mjs
      - name: Execute the compiled native acceptance inventory
        run: node scripts/verify-opencode-v2-package.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: DevRyan-windows-native-${{ matrix.arch }}
          path: |
            .cache/windows-native/${{ matrix.arch }}
            packages/web/runtime/win32-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 7
