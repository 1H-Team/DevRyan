name: Docs Source

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "scripts/docs/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing tag to upload docs source archive"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-and-package:
    if: ${{ !contains(github.event.release.tag_name || inputs.release_tag || '', '-windows-preview.') }}
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.archive.outputs.archive_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Validate docs source
        run: bun run docs:validate

      - name: Build docs source archive
        id: archive
        run: |
          mkdir -p artifacts
          ARCHIVE_NAME="DevRyan-docs-source-${GITHUB_SHA::8}.tar.gz"
          tar -czf "artifacts/${ARCHIVE_NAME}" -C packages/docs .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevRyan-docs-source
          path: artifacts/${{ steps.archive.outputs.archive_name }}
          retention-days: 14
