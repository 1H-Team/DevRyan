name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0} dry run', inputs.mode) || format('Release {0}', github.ref_name) }}

# A vX.Y.Z tag push builds DevRyan-X.Y.Z-arm64.dmg, stages it on a draft and publishes it.
# A manual run is a dry run of the same graph on its ref and never writes to this repository:
#   mode=build  packages and qualifies, then stops;
#   mode=stage  also stages, publishes and verifies the DMG in 1H-Team/DevRyan-release-staging.
# Retry a failed release on the same version by re-running the failed jobs; a rebuild at the
# same SHA reuses the retained DMG. Move the tag only for a code fix
# (`git tag -f vX.Y.Z <sha> && git push --atomic origin main +refs/tags/vX.Y.Z`).
# See docs/RELEASE_PIPELINE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      mode:
        description: 'build: package and qualify only. stage: also stage, publish and verify in the staging repository.'
        type: choice
        options:
          - build
          - stage
        default: build

env:
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
  RELEASE_TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && '1H-Team/DevRyan-release-staging' || github.repository }}

permissions:
  contents: read

# Cancel obsolete builds, never an in-flight staging or production publication.

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      release_id: ${{ steps.preflight.outputs.release_id }}
      published: ${{ steps.preflight.outputs.published }}
      candidate_run_id: ${{ steps.preflight.outputs.candidate_run_id }}
      reuse_run_id: ${{ steps.preflight.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check versions, lockfile, publication state, pipeline changes and build reuse
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-preflight.mjs

  trusted-ci:
    needs: preflight
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for canonical main CI (and its re-runs) outside the publication lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-ci-wait.mjs

  verify-published:
    needs: [preflight, trusted-ci]
    if: ${{ needs.preflight.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ASSET_DIRECTORY: retained-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-candidate
      - name: Verify original published bytes without rebuilding or deploying
        run: node scripts/release.mjs verify-published

  web:
    concurrency:
      group: release-build-${{ github.ref_name }}-web
      cancel-in-progress: true
    needs: preflight
    if: ${{ needs.preflight.outputs.published != 'true' && needs.preflight.outputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      # CI checks types independently; this run builds its own release artifact.
      - name: Build web assets and check bundle budgets
        env:
          VITE_ENABLE_REACT_SCAN: 'false'
        run: bun run build:web && bun run bundle:check
      - name: Describe web artifact
        env:
          RELEASE_OPERATION: web-describe
        run: |
          mkdir -p artifacts
          cp -R packages/web/dist artifacts/web
          node scripts/release-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          overwrite: true
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  electron-package:
    concurrency:
      group: release-build-${{ github.ref_name }}-electron-package
      cancel-in-progress: true
    needs: [preflight, web]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.published != 'true' && (needs.web.result == 'success' || needs.preflight.outputs.reuse_run_id != '') }}
    # A DMG already built at this SHA (an earlier attempt, run or staging dry run) is adopted on Ubuntu.
    runs-on: ${{ needs.preflight.outputs.reuse_run_id != '' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_BUILDER_ARCH: arm64
      VERSION: ${{ needs.preflight.outputs.version }}
      APP_DIR: packages/electron/dist/mac-arm64
      REUSE_RUN_ID: ${{ needs.preflight.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adopt the DMG already built at this source
        if: ${{ env.REUSE_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs adopt "$REUSE_RUN_ID" packages/electron/dist
      - uses: oven-sh/setup-bun@v2
        if: ${{ env.REUSE_RUN_ID == '' }}
        with:
          bun-version: '1.4.3'
      - name: Install target dependencies
        if: ${{ env.REUSE_RUN_ID == '' }}
        # Web assets come from the web job and native inputs are built below.
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile --cpu '*' --os darwin
      - name: Restore reviewed Claude executable
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Build and verify native v2 runtime
        if: ${{ env.REUSE_RUN_ID == '' }}
        timeout-minutes: 20
        run: bun scripts/build-native-runtime.mjs
      - name: Prepare native helpers
        if: ${{ env.REUSE_RUN_ID == '' }}
        working-directory: packages/electron
        run: bun run build:native-helpers
      - name: Bundle main process
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: bun run build:electron
      - name: Rebuild native bindings
        if: ${{ env.REUSE_RUN_ID == '' }}
        working-directory: packages/electron
        run: bun run rebuild:native
      - uses: actions/download-artifact@v4
        if: ${{ env.REUSE_RUN_ID == '' }}
        with:
          name: web-release
          path: web-artifact
      - name: Stage web assets
        if: ${{ env.REUSE_RUN_ID == '' }}
        env:
          RELEASE_OPERATION: web-stage
          RELEASE_ARTIFACT_DIR: web-artifact
          RELEASE_WEB_TARGET: electron
        run: node scripts/release-ci.mjs
      - name: Package the app
        if: ${{ env.REUSE_RUN_ID == '' }}
        working-directory: packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/package-prepared.mjs --mac --arm64 --publish=never -c.mac.identity=null -c.mac.notarize=false -c.dmg.sign=false
      - name: Check Cursor SDK native artifacts
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          test -n "$APP_PATH" || { echo "Error: .app not found under $APP_DIR"; ls -la packages/electron/dist/; exit 1; }
          CURSOR="$APP_PATH/Contents/Resources/app.asar.unpacked/node_modules/@cursor/sdk-darwin-arm64"
          for file in "$CURSOR/bin/rg" "$CURSOR/bin/cursorsandbox"; do
            test -x "$file" || { echo "Error: executable Cursor SDK artifact missing: $file"; exit 1; }
          done
          for file in "$CURSOR/vendor/tree-sitter/binding.node" "$CURSOR/vendor/tree-sitter-bash/binding.node"; do
            test -f "$file" || { echo "Error: Cursor SDK native binding missing: $file"; exit 1; }
          done
      - name: Check packaged orchestration config
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          EXTRACT_ROOT="$RUNNER_TEMP/devryan-electron-asar"
          rm -rf "$EXTRACT_ROOT"
          ASAR_CLI=$(find node_modules/.bun -path '*/@electron+asar@*/node_modules/@electron/asar/bin/asar.js' -print -quit)
          test -n "$ASAR_CLI" || { echo "Error: installed Electron asar CLI not found in the Bun dependency tree."; exit 1; }
          node "$ASAR_CLI" extract "$APP_PATH/Contents/Resources/app.asar" "$EXTRACT_ROOT"
          ARTIFACT_ROOT="$EXTRACT_ROOT/node_modules/@devryan/web/server/default-config"
          node scripts/verify-default-config-artifact.mjs --source packages/web/server/default-config --artifact-root "$ARTIFACT_ROOT"
          node scripts/smoke-packaged-orchestration-config.mjs --config-root "$ARTIFACT_ROOT"
      - name: Check retired Bots packaging
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          test ! -e "$APP_PATH/Contents/Resources/bot-runtime/images.release.json"
          test ! -e "$APP_PATH/Contents/Resources/bot-runtime/compose.production.yml"
      - name: Check macOS usage descriptions
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          for key in NSAppleEventsUsageDescription NSDesktopFolderUsageDescription NSDocumentsFolderUsageDescription NSDownloadsFolderUsageDescription; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true)
            test -n "$value" || { echo "Error: required Info.plist usage description missing: $key"; exit 1; }
          done
      - name: Bind candidate bytes to this source and run, and write the release manifest
        if: ${{ env.REUSE_RUN_ID == '' }}
        run: node scripts/release-candidate.mjs packages/electron/dist
      - uses: actions/upload-artifact@v4
        with:
          name: DevRyan-macos-arm64-candidate-identity
          path: |
            packages/electron/dist/candidate.json
            packages/electron/dist/release-manifest.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          overwrite: true
          path: packages/electron/dist/DevRyan-${{ needs.preflight.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 90

  upgrade-check:
    concurrency:
      group: release-build-${{ github.ref_name }}-upgrade-check
      cancel-in-progress: true
    # The previous supported release's profile is prepared while the package runner builds the candidate.
    needs: preflight
    if: ${{ needs.preflight.outputs.published != 'true' }}
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - name: Prepare the previous supported release, wait for this run's candidate and qualify the upgrade
        run: node scripts/qa/release-preaged-upgrades.mjs "$RUNNER_TEMP/release-reports"
      - name: Export incomplete qualification reports if setup failed
        if: ${{ always() }}
        run: node scripts/qa/release-upgrade-lanes.mjs --report-dir "$RUNNER_TEMP/release-reports" --fallback-reports
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-upgrade
          path: ${{ runner.temp }}/release-reports/
          if-no-files-found: warn
          retention-days: 90

  final-dmg-smoke:
    concurrency:
      group: release-build-${{ github.ref_name }}-final-dmg-smoke
      cancel-in-progress: true
    needs: [preflight, electron-package]
    if: ${{ !cancelled() && needs.electron-package.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install smoke dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: candidate-dmg
      - name: Observe the unchanged final DMG first launch
        # Quarantined as a tracked defect (docs/RELEASE_PIPELINE.md, "Final-DMG smoke") until
        # three distinct runs pass and DEVRYAN_FINAL_DMG_SMOKE_GATE is set.
        continue-on-error: ${{ vars.DEVRYAN_FINAL_DMG_SMOKE_GATE != 'qualified-3-runs' }}
        run: node scripts/qa/release-final-dmg-smoke.mjs --dmg "$PWD/candidate-dmg/DevRyan-${{ needs.preflight.outputs.version }}-arm64.dmg" --report "$RUNNER_TEMP/release-smoke/report.json"
      - name: Export an incomplete qualification report if setup failed
        if: ${{ always() }}
        env:
          REPORT_PATH: ${{ runner.temp }}/release-smoke/report.json
          REPORT_KIND: release-final-dmg-smoke
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const file = process.env.REPORT_PATH;
          if (!await fs.stat(file).catch(() => null)) {
            await fs.mkdir(path.dirname(file), { recursive: true });
            await fs.writeFile(file, JSON.stringify({ schemaVersion: 1, kind: process.env.REPORT_KIND,
              sourceRevision: process.env.GITHUB_SHA, runID: process.env.GITHUB_RUN_ID,
              passed: false, failures: ['Qualification did not complete; inspect the failed setup step'] }) + '\n');
          }
          NODE
      - name: Summarize the smoke and its quarantine
        if: ${{ always() }}
        env:
          DEVRYAN_FINAL_DMG_SMOKE_GATE: ${{ vars.DEVRYAN_FINAL_DMG_SMOKE_GATE }}
        run: node scripts/qa/release-final-dmg-smoke.mjs --summary "$RUNNER_TEMP/release-smoke/report.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-final-dmg-smoke
          path: ${{ runner.temp }}/release-smoke/
          if-no-files-found: warn
          retention-days: 90

  stage:
    concurrency:
      group: devryan-production-publication
      cancel-in-progress: false
    needs: [preflight, electron-package, upgrade-check, final-dmg-smoke]
    if: ${{ !cancelled() && needs.preflight.outputs.published != 'true' && (github.event_name == 'push' || inputs.mode == 'stage') && needs.electron-package.result == 'success' && needs.upgrade-check.result == 'success' && (needs.final-dmg-smoke.result == 'success' || vars.DEVRYAN_FINAL_DMG_SMOKE_GATE != 'qualified-3-runs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      published: ${{ steps.stage.outputs.published }}
      release_id: ${{ steps.stage.outputs.release_id }}
      staged: ${{ steps.stage.outputs.staged }}
    env:
      RELEASE_ASSET_DIRECTORY: release-assets
      RELEASE_MANIFEST_PATH: release-identity/release-manifest.json
      RELEASE_PUBLICATION_LOCK: devryan-production-publication
      # A tag push writes only with this repository's token; a staging dry run only with the staging token.
      GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
      RELEASE_STAGING_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.DEVRYAN_RELEASE_STAGING_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-candidate-identity
          path: release-identity
      - name: Stage the DMG on the draft and prove every shipped updater discovers it
        id: stage
        env:
          RELEASE_STAGED_PATH: ${{ runner.temp }}/staged.json
        run: node scripts/release.mjs stage
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-staged
          path: ${{ runner.temp }}/staged.json
          if-no-files-found: ignore
          retention-days: 90

  deploy-backend:
    concurrency:
      group: devryan-backend-deploy
      cancel-in-progress: false
    needs: [preflight, trusted-ci, stage]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.trusted-ci.result == 'success' && needs.stage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DevRyan Secrets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Deploy and verify Supabase configuration and migrations (idempotent)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Error: required release secret ${name} is not configured."
              exit 1
            fi
          done
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          node scripts/sync-supabase-auth-password-policy.mjs
          supabase db push --linked --dry-run
          supabase db push --linked --yes
          MIGRATION_STATUS_PATH="${RUNNER_TEMP}/supabase-migrations.json"
          supabase migration list --linked --output-format json > "$MIGRATION_STATUS_PATH"
          MIGRATION_STATUS_PATH="$MIGRATION_STATUS_PATH" node - <<'NODE'
          const fs = require('fs');
          const migrations = JSON.parse(fs.readFileSync(process.env.MIGRATION_STATUS_PATH, 'utf8'));
          const drift = (migrations.migrations || []).filter((entry) => !entry.local || !entry.remote || entry.local !== entry.remote);
          if (drift.length > 0) throw new Error(`Supabase migration history diverged for ${drift.length} migration(s).`);
          NODE

  publish:
    concurrency:
      group: devryan-production-publication
      cancel-in-progress: false
    needs: [preflight, trusted-ci, stage, deploy-backend]
    if: ${{ !cancelled() && needs.stage.result == 'success' && ((github.event_name == 'push' && needs.trusted-ci.result == 'success' && needs.deploy-backend.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stage')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_ASSET_DIRECTORY: release-assets
      RELEASE_PUBLICATION_LOCK: devryan-production-publication
      RELEASE_STAGED: ${{ needs.stage.outputs.staged }}
      GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
      RELEASE_STAGING_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.DEVRYAN_RELEASE_STAGING_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: release-assets
      - name: Recheck exact-source CI inside the publication lock
        if: ${{ github.event_name == 'push' }}
        run: node scripts/release.mjs trusted-ci
      - name: Publish the unchanged staged draft, record the ledger and confirm the shipped updaters discover the DMG
        run: node scripts/release.mjs publish
