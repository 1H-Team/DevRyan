name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Verify package versions match release tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const expected = process.env.VERSION;
          const packageFiles = [
            'package.json',
            'packages/bot-computer/package.json',
            'packages/bot-engine-proxy/package.json',
            'packages/bot-egress/package.json',
            'packages/bot-indexer/package.json',
            'packages/bot-supervisor/package.json',
            'packages/bots-runtime/package.json',
            'packages/cursor-sdk-runtime/package.json',
            'packages/harness-runtime/package.json',
            'packages/orchestration-runtime/package.json',
            'packages/shared-runtime/package.json',
            'packages/ui/package.json',
            'packages/web/package.json',
            'packages/desktop/package.json',
            'packages/electron/package.json',
            'packages/vscode/package.json',
          ];
          const jsonFiles = [
            ...packageFiles,
            'packages/desktop/src-tauri/tauri.conf.json',
          ];

          const mismatches = [];
          for (const file of jsonFiles) {
            const version = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (version !== expected) mismatches.push(`${file}: ${version}`);
          }

          const cargoToml = fs.readFileSync('packages/desktop/src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          if (cargoVersion !== expected) mismatches.push(`packages/desktop/src-tauri/Cargo.toml: ${cargoVersion ?? 'missing'}`);

          const cargoLock = fs.readFileSync('packages/desktop/src-tauri/Cargo.lock', 'utf8');
          const lockMatch = cargoLock.match(/name = "openchamber-desktop"\nversion = "([^"]+)"/);
          const lockVersion = lockMatch?.[1];
          if (lockVersion !== expected) mismatches.push(`packages/desktop/src-tauri/Cargo.lock: ${lockVersion ?? 'missing'}`);

          if (mismatches.length > 0) {
            throw new Error(`Release version ${expected} does not match metadata versions:\n${mismatches.join('\n')}\nRun: node scripts/bump-version.mjs ${expected}`);
          }
          NODE

      - name: Prepare release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const version = process.env.VERSION;
          const outputPath = process.env.RELEASE_NOTES_PATH;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## [${version}]`;
          const start = changelog.indexOf(heading);
          if (start === -1) {
            throw new Error(`CHANGELOG.md does not contain release notes for ${version}`);
          }

          const sectionStart = changelog.indexOf('\n', start);
          const nextSection = changelog.indexOf('\n## ', sectionStart + 1);
          const body = changelog
            .slice(sectionStart + 1, nextSection === -1 ? undefined : nextSection)
            .trim();

          if (!body) {
            throw new Error(`CHANGELOG.md release notes for ${version} are empty`);
          }

          fs.writeFileSync(outputPath, `${body}\n`);
          NODE
          echo "path=${RELEASE_NOTES_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: false
          name: DevRyan v${{ steps.get_version.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Create npm tarball
        working-directory: packages/web
        run: npm pack

      - name: Verify npm packaged orchestration config
        run: |
          set -euo pipefail
          TARBALL=$(find packages/web -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          EXTRACT_ROOT="$RUNNER_TEMP/devryan-web-npm"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          tar -xzf "$TARBALL" -C "$EXTRACT_ROOT"
          ARTIFACT_ROOT="$EXTRACT_ROOT/package/server/default-config"
          node scripts/verify-default-config-artifact.mjs \
            --source packages/web/server/default-config \
            --artifact-root "$ARTIFACT_ROOT"
          node scripts/smoke-packaged-orchestration-config.mjs --config-root "$ARTIFACT_ROOT"

      - name: Stage branded npm tarball for GitHub Release
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find packages/web -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Error: expected exactly one npm tarball, found ${#TARBALLS[@]}."
            printf '%s\n' "${TARBALLS[@]}"
            exit 1
          fi
          mkdir -p artifacts
          cp "${TARBALLS[0]}" "artifacts/DevRyan-web-${VERSION}.tgz"

      - name: Upload npm tarball to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: artifacts/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi

          if npm view "@openchamber/web@${VERSION}" version >/dev/null 2>&1; then
            echo "@openchamber/web@${VERSION} is already published; skipping npm publish."
            exit 0
          fi

          npm publish --access public

  publish-bot-runtime-images:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build, attest, publish, and keylessly sign Bot runtime images
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          REPOSITORY_PREFIX="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          MANIFEST="artifacts/DevRyan-bot-runtime-images-${VERSION}.json"
          mkdir -p artifacts
          node scripts/build-bot-runtime-images.mjs \
            --version "$VERSION" \
            --revision "$SOURCE_REVISION" \
            --repository-prefix "$REPOSITORY_PREFIX" \
            --output "$MANIFEST"
          node scripts/verify-bot-runtime-images.mjs \
            --manifest "$MANIFEST" \
            --version "$VERSION" \
            --revision "$SOURCE_REVISION" \
            --repository-prefix "$REPOSITORY_PREFIX" \
            --check-anonymous

      - name: Upload Bot runtime manifest for Electron release builds
        uses: actions/upload-artifact@v4
        with:
          name: bot-runtime-images
          path: artifacts/DevRyan-bot-runtime-images-${{ needs.create-release.outputs.version }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Bot runtime manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: artifacts/DevRyan-bot-runtime-images-${{ needs.create-release.outputs.version }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-macos:
    needs: [create-release, publish-bot-runtime-images]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
          - target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu '*' --os darwin

      - name: Download signed Bot runtime image manifest
        uses: actions/download-artifact@v4
        with:
          name: bot-runtime-images
          path: ${{ runner.temp }}/bot-runtime-images

      - name: Install Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Apple signing certificate secrets are not configured; building an unsigned DMG."
            exit 0
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/electron-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "Error: imported certificate does not include a Developer ID Application identity."
            exit 1
          fi

      - name: Build Electron app
        working-directory: packages/electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          # rebuild-native.mjs reads this to target the right arch when
          # cross-building (runner is arm64; x64 matrix needs the hint).
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
          DEVRYAN_BOT_RUNTIME_REQUIRE_RELEASE_MANIFEST: '1'
          DEVRYAN_BOT_RUNTIME_MANIFEST_PATH: ${{ runner.temp }}/bot-runtime-images/DevRyan-bot-runtime-images-${{ needs.create-release.outputs.version }}.json
          DEVRYAN_BOT_RUNTIME_SOURCE_REVISION: ${{ github.sha }}
          DEVRYAN_BOT_RUNTIME_REPOSITORY_PREFIX: ghcr.io/1h-team
        run: |
          set -euo pipefail

          bun run build:web-assets
          bun run build:native-helpers
          bun run bundle:main
          # npmRebuild=false in package.json, so electron-builder won't
          # recompile native deps on its own — we must rebuild against the
          # target Electron ABI before packaging, otherwise better-sqlite3/
          # node-pty/bun-pty crash on require inside the packaged app.
          bun run rebuild:native
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ "${CSC_IDENTITY_AUTO_DISCOVERY:-false}" = "true" ]; then
            ./node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish=never
          else
            ./node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish=never -c.mac.identity=null -c.mac.notarize=false -c.dmg.sign=false
          fi
          bun run verify:runtime-service-package -- --arch "${{ matrix.arch }}"

      - name: Verify Electron Cursor SDK native artifacts
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            arm64)
              APP_DIR="packages/electron/dist/mac-arm64"
              CURSOR_SDK_PLATFORM_PACKAGE="sdk-darwin-arm64"
              ;;
            x64)
              APP_DIR="packages/electron/dist/mac"
              CURSOR_SDK_PLATFORM_PACKAGE="sdk-darwin-x64"
              ;;
            *)
              echo "Error: unsupported Electron architecture: ${{ matrix.arch }}"
              exit 1
              ;;
          esac

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under $APP_DIR"
            ls -la packages/electron/dist/
            exit 1
          fi

          CURSOR_PLATFORM_PATH="$APP_PATH/Contents/Resources/app.asar.unpacked/node_modules/@cursor/$CURSOR_SDK_PLATFORM_PACKAGE"
          if [ ! -d "$CURSOR_PLATFORM_PATH" ]; then
            echo "Error: Cursor SDK platform package missing: $CURSOR_PLATFORM_PATH"
            find "$APP_PATH/Contents/Resources/app.asar.unpacked/node_modules/@cursor" -maxdepth 4 -print 2>/dev/null || true
            exit 1
          fi
          for executable in \
            "$CURSOR_PLATFORM_PATH/bin/rg" \
            "$CURSOR_PLATFORM_PATH/bin/cursorsandbox"
          do
            if [ ! -x "$executable" ]; then
              echo "Error: executable Cursor SDK artifact missing: $executable"
              find "$APP_PATH/Contents/Resources/app.asar.unpacked/node_modules/@cursor" -maxdepth 4 -print 2>/dev/null || true
              exit 1
            fi
          done
          for binding in \
            "$CURSOR_PLATFORM_PATH/vendor/tree-sitter/binding.node" \
            "$CURSOR_PLATFORM_PATH/vendor/tree-sitter-bash/binding.node"
          do
            if [ ! -f "$binding" ]; then
              echo "Error: Cursor SDK native binding missing: $binding"
              find "$APP_PATH/Contents/Resources/app.asar.unpacked/node_modules/@cursor" -maxdepth 4 -print 2>/dev/null || true
              exit 1
            fi
          done

      - name: Verify packaged Electron orchestration config
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            arm64) APP_DIR="packages/electron/dist/mac-arm64" ;;
            x64) APP_DIR="packages/electron/dist/mac" ;;
            *) echo "Error: unsupported Electron architecture: ${{ matrix.arch }}"; exit 1 ;;
          esac
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          test -n "$APP_PATH"
          ASAR_PATH="$APP_PATH/Contents/Resources/app.asar"
          test -f "$ASAR_PATH"
          EXTRACT_ROOT="$RUNNER_TEMP/devryan-electron-asar-${{ matrix.arch }}"
          rm -rf "$EXTRACT_ROOT"
          ASAR_CLI=$(find node_modules/.bun -path '*/@electron+asar@*/node_modules/@electron/asar/bin/asar.js' -print -quit)
          if [ -z "$ASAR_CLI" ]; then
            echo "Error: installed Electron asar CLI not found in the Bun dependency tree."
            exit 1
          fi
          node "$ASAR_CLI" extract "$ASAR_PATH" "$EXTRACT_ROOT"
          ARTIFACT_ROOT="$EXTRACT_ROOT/node_modules/@openchamber/web/server/default-config"
          node scripts/verify-default-config-artifact.mjs \
            --source packages/web/server/default-config \
            --artifact-root "$ARTIFACT_ROOT"
          node scripts/smoke-packaged-orchestration-config.mjs --config-root "$ARTIFACT_ROOT"

      - name: Verify packaged Electron Bot runtime image manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            arm64) APP_DIR="packages/electron/dist/mac-arm64" ;;
            x64) APP_DIR="packages/electron/dist/mac" ;;
            *) echo "Error: unsupported Electron architecture: ${{ matrix.arch }}"; exit 1 ;;
          esac
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          test -n "$APP_PATH"
          PACKAGED_MANIFEST="$APP_PATH/Contents/Resources/bot-runtime/images.release.json"
          SOURCE_MANIFEST="$RUNNER_TEMP/bot-runtime-images/DevRyan-bot-runtime-images-${VERSION}.json"
          test -f "$PACKAGED_MANIFEST"
          cmp "$SOURCE_MANIFEST" "$PACKAGED_MANIFEST"
          node scripts/verify-bot-runtime-images.mjs \
            --manifest "$PACKAGED_MANIFEST" \
            --version "$VERSION" \
            --revision "$SOURCE_REVISION" \
            --repository-prefix ghcr.io/1h-team

      - name: Verify Electron macOS usage descriptions
        run: |
          set -euo pipefail

          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under packages/electron/dist/mac*"
            ls -la packages/electron/dist/
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          for key in \
            NSAppleEventsUsageDescription \
            NSDesktopFolderUsageDescription \
            NSDocumentsFolderUsageDescription \
            NSDownloadsFolderUsageDescription
          do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$INFO_PLIST" 2>/dev/null || true)
            if [ -z "$value" ]; then
              echo "Error: required Info.plist usage description missing: $key"
              exit 1
            fi
          done

      - name: Verify signature + entitlements + notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ]; then
            echo "Apple signing/notarization secrets are not configured; skipping notarization verification for unsigned DMG."
            exit 0
          fi

          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under packages/electron/dist/mac*"
            ls -la packages/electron/dist/
            exit 1
          fi

          echo "Verifying $APP_PATH"
          codesign -vv --deep --strict "$APP_PATH"

          # Require hardened runtime
          CS_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          echo "$CS_INFO"
          if ! echo "$CS_INFO" | grep -q "flags=.*runtime"; then
            echo "Error: hardened runtime flag missing"
            exit 1
          fi

          # Require notary ticket stapled
          xcrun stapler validate "$APP_PATH"

          # Require Gatekeeper acceptance for the app bundle.
          spctl -a -vvv -t exec "$APP_PATH"

          DMG_PATH=$(find packages/electron/dist -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "Error: DMG not found under packages/electron/dist"
            ls -la packages/electron/dist/
            exit 1
          fi

          echo "Verifying DMG Gatekeeper assessment: $DMG_PATH"
          spctl -a -vvv -t open --context context:primary-signature "$DMG_PATH"

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>&1 || true)
          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "Error: app sandbox entitlement is present"
            exit 1
          fi
          for key in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation
          do
            if ! echo "$ENTITLEMENTS" | grep -q "<key>$key</key>"; then
              echo "Error: required entitlement missing: $key"
              exit 1
            fi
          done

      - name: Upload DMG / ZIP / blockmaps to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-arch latest-mac.yml for merge
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest-mac.yml
          retention-days: 1

  combine-electron-manifests:
    needs: [create-release, build-desktop-electron-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download per-arch latest-mac.yml
        uses: actions/download-artifact@v4
        with:
          pattern: latest-yml-*-apple-darwin
          path: artifacts

      - name: Finalize combined latest-mac.yml
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
        run: node packages/electron/scripts/finalize-latest-yml.mjs

      - name: Upload combined latest-mac.yml to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: ${{ runner.temp }}/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, publish-bot-runtime-images, build-desktop-electron-macos, publish-npm, combine-electron-manifests]
    if: ${{ needs.create-release.result == 'success' && needs.publish-bot-runtime-images.result == 'success' && needs.build-desktop-electron-macos.result == 'success' && needs.publish-npm.result == 'success' && needs.combine-electron-manifests.result == 'success' }}
    runs-on: ubuntu-latest
    environment: DevRyan Secrets
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_UPDATE_ROLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Verify required release assets before publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node scripts/verify-release-assets.mjs

      - name: Deploy and verify Supabase configuration and migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Error: required release secret ${name} is not configured."
              exit 1
            fi
          done

          supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          node scripts/sync-supabase-auth-password-policy.mjs
          supabase db push --linked --dry-run
          supabase db push --linked --yes

          MIGRATION_STATUS_PATH="${RUNNER_TEMP}/supabase-migrations.json"
          SCHEMA_STATUS_PATH="${RUNNER_TEMP}/supabase-bot-schema.json"
          supabase migration list --linked --output-format json > "$MIGRATION_STATUS_PATH"
          supabase db query --linked --agent=no --output json \
            "select public.devryan_bot_schema_version() as schema_version;" \
            > "$SCHEMA_STATUS_PATH"
          MIGRATION_STATUS_PATH="$MIGRATION_STATUS_PATH" \
          SCHEMA_STATUS_PATH="$SCHEMA_STATUS_PATH" \
          node - <<'NODE'
          const fs = require('fs');

          const migrations = JSON.parse(fs.readFileSync(process.env.MIGRATION_STATUS_PATH, 'utf8'));
          const drift = (migrations.migrations || []).filter((entry) => (
            !entry.local || !entry.remote || entry.local !== entry.remote
          ));
          if (drift.length > 0) {
            throw new Error(`Supabase migration history diverged for ${drift.length} migration(s).`);
          }

          const source = fs.readFileSync('packages/web/server/lib/multi-user/auth-compat.js', 'utf8');
          const expected = source.match(/PRODUCTION_BOTS_MIGRATION = '(\d{14})'/)?.[1];
          const schema = JSON.parse(fs.readFileSync(process.env.SCHEMA_STATUS_PATH, 'utf8'));
          const schemaRows = Array.isArray(schema) ? schema : schema.rows;
          const actual = schemaRows?.[0]?.schema_version;
          if (!expected || actual !== expected) {
            throw new Error(`Production Bot schema marker mismatch: expected ${expected || 'missing'}, received ${actual || 'missing'}.`);
          }
          NODE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send release to Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_ROLE_ID: ${{ env.DISCORD_UPDATE_ROLE_ID }}
        run: |
          node - <<'NODE'
          (async () => {
            const tag = `v${process.env.VERSION}`;
            const repo = process.env.REPOSITORY;
            const rawRoleId = (process.env.UPDATE_ROLE_ID || '').trim();
            const updateRoleId = /^\d+$/.test(rawRoleId) ? rawRoleId : '';

            const releaseRes = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });

            if (!releaseRes.ok) {
              const body = await releaseRes.text();
              throw new Error(`Failed to fetch release ${tag}: ${releaseRes.status} ${body}`);
            }

            const release = await releaseRes.json();
            const description = (release.body || `OpenChamber ${tag} released.`).slice(0, 4096);
            const mention = updateRoleId ? `<@&${updateRoleId}>` : '';

            const payload = {
              username: 'OpenChamber Releases',
              ...(mention ? { content: mention } : {}),
              ...(updateRoleId
                ? {
                    allowed_mentions: {
                      roles: [updateRoleId],
                    },
                  }
                : {}),
              embeds: [
                {
                  title: release.name || `OpenChamber ${tag}`,
                  url: release.html_url,
                  description,
                  color: 2105893,
                  footer: { text: 'OpenChamber Changelog' },
                },
              ],
            };

            const discordRes = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!discordRes.ok) {
              const body = await discordRes.text();
              throw new Error(`Failed to send Discord release: ${discordRes.status} ${body}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Trigger openchamber-website site refresh (optional)
        env:
          WEBSITE_REPO: openchamber/openchamber-website
          WEBSITE_TOKEN: ${{ secrets.OPENCHAMBER_WEBSITE_REPO_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "OPENCHAMBER_WEBSITE_REPO_TOKEN not set; skip site refresh dispatch."
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$WEBSITE_REPO/dispatches \
            -d @- <<JSON
          {
            "event_type": "site_refresh_requested",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "release_tag": "v$VERSION"
            }
          }
          JSON
