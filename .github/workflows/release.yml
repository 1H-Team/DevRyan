name: Release

# A vX.Y.Z tag push builds DevRyan-X.Y.Z-arm64.dmg, attaches it to a draft and publishes it.
# A manual run is a dry run of the same graph on its ref: it builds everything and publishes nothing.
# Retry a failed release on the same version: re-run the failed jobs, or move the tag to a fixed
# commit (`git tag -f vX.Y.Z <sha> && git push -f origin vX.Y.Z`); `admit` reuses the draft.
# See docs/RELEASE_PIPELINE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

# Cancel obsolete builds, never an in-flight production publication.

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.admit.outputs.version }}
      release_id: ${{ steps.admit.outputs.release_id }}
      published: ${{ steps.admit.outputs.published }}
      candidate_run_id: ${{ steps.admit.outputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require trusted main CI for this exact source commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs trusted-ci
      - name: Check version metadata and create or reuse the draft
        id: admit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs admit

  verify-published:
    needs: admit
    if: ${{ needs.admit.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.admit.outputs.release_id }}
      RELEASE_ASSET_DIRECTORY: retained-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          run-id: ${{ needs.admit.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-candidate
      - name: Verify original published bytes without rebuilding or deploying
        run: node scripts/release.mjs verify-published

  web:
    concurrency:
      group: release-build-${{ github.ref_name }}-web${{ matrix.baseline || '' }}
      cancel-in-progress: true
    needs: admit
    if: ${{ needs.admit.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      # Admission already required trusted CI for this exact commit, whose
      # validate:full type-checks every package; this job only builds the artifact.
      - name: Build web assets and check bundle budgets
        env:
          VITE_ENABLE_REACT_SCAN: 'false'
        run: bun run build:web && bun run bundle:check
      - name: Describe web artifact
        env:
          RELEASE_OPERATION: web-describe
        run: |
          mkdir -p artifacts
          cp -R packages/web/dist artifacts/web
          node scripts/release-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  electron-prepare:
    concurrency:
      group: release-build-${{ github.ref_name }}-electron-prepare${{ matrix.baseline || '' }}
      cancel-in-progress: true
    needs: admit
    if: ${{ needs.admit.outputs.published != 'true' }}
    runs-on: macos-26
    # A stalled native build fails the release instead of holding it open.
    timeout-minutes: 35
    env:
      ELECTRON_BUILDER_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install target dependencies
        # Web assets come from the web job and native inputs are built below.
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile --cpu '*' --os darwin
      - name: Restore reviewed Claude executable
        run: node scripts/hydrate-reviewed-claude.mjs
      - name: Build and verify native v2 runtime
        timeout-minutes: 20
        run: bun scripts/build-native-runtime.mjs
      - name: Prepare native helpers
        working-directory: packages/electron
        run: bun run build:native-helpers
      - name: Bundle main process
        run: bun run build:electron
      - name: Rebuild native bindings
        working-directory: packages/electron
        run: bun run rebuild:native
      - name: Export prepared app inputs
        env:
          RELEASE_OPERATION: prepare-export
        run: node scripts/release-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: electron-prepared-arm64
          path: artifacts/prepared.*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  bot-resolve:
    needs: admit
    if: ${{ needs.admit.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Reuse verified images with unchanged inputs; list the rest
        id: resolve
        env:
          RELEASE_OPERATION: image-resolve
        run: node scripts/release-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bot-images-resolved
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  bot-build:
    name: bot-build (${{ matrix.image }})
    needs: [admit, bot-resolve]
    if: ${{ needs.admit.outputs.published != 'true' && needs.bot-resolve.outputs.build != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ fromJSON(needs.bot-resolve.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve image build identity
        id: image
        env:
          RELEASE_OPERATION: image-plan
          IMAGE_KEY: ${{ matrix.image }}
        run: node scripts/release-ci.mjs
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.admit.outputs.version }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=devryan-bot-${{ matrix.image }}
          cache-to: type=gha,scope=devryan-bot-${{ matrix.image }},mode=max
      - name: Sign image and tag its inputs
        env:
          RELEASE_OPERATION: image-sign
          IMAGE_KEY: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/release-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bot-images-built-${{ matrix.image }}
          path: artifacts/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 14

  bot-publish:
    needs: [admit, bot-resolve, bot-build]
    if: ${{ !cancelled() && needs.bot-resolve.result == 'success' && (needs.bot-build.result == 'success' || needs.bot-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bot-images-*
          merge-multiple: true
          path: artifacts
      - name: Assemble the Bot runtime manifest
        env:
          RELEASE_OPERATION: image-assemble
        run: node scripts/release-ci.mjs
      - name: Verify anonymous image access
        run: |
          set -euo pipefail
          REPOSITORY_PREFIX="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          node scripts/verify-bot-runtime-images.mjs --manifest "artifacts/DevRyan-bot-runtime-images-${VERSION}.json" \
            --version "$VERSION" --revision "$GITHUB_SHA" --repository-prefix "$REPOSITORY_PREFIX" --check-anonymous
      - name: Smoke the isolated production topology
        run: node scripts/smoke-bot-runtime-images.mjs --manifest "artifacts/DevRyan-bot-runtime-images-${VERSION}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bot-runtime-images
          path: artifacts/DevRyan-bot-runtime-images-${{ needs.admit.outputs.version }}.json
          if-no-files-found: error
          retention-days: 14

  electron-package:
    concurrency:
      group: release-build-${{ github.ref_name }}-electron-package${{ matrix.baseline || '' }}
      cancel-in-progress: true
    needs: [admit, web, electron-prepare, bot-publish]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.electron-prepare.result == 'success' && needs.bot-publish.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      ELECTRON_BUILDER_ARCH: arm64
      VERSION: ${{ needs.admit.outputs.version }}
      APP_DIR: packages/electron/dist/mac-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: electron-prepared-arm64
          path: artifacts
      - name: Import prepared app inputs
        env:
          RELEASE_OPERATION: prepare-import
        run: node scripts/release-ci.mjs
      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: web-artifact
      - name: Stage web assets
        env:
          RELEASE_OPERATION: web-stage
          RELEASE_ARTIFACT_DIR: web-artifact
          RELEASE_WEB_TARGET: electron
        run: node scripts/release-ci.mjs
      - uses: actions/download-artifact@v4
        with:
          name: bot-runtime-images
          path: ${{ runner.temp }}/bot-runtime-images
      - name: Package the app
        working-directory: packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEVRYAN_BOT_RUNTIME_MANIFEST_PATH: ${{ runner.temp }}/bot-runtime-images/DevRyan-bot-runtime-images-${{ needs.admit.outputs.version }}.json
          DEVRYAN_BOT_RUNTIME_SOURCE_REVISION: ${{ github.sha }}
          DEVRYAN_BOT_RUNTIME_REPOSITORY_PREFIX: ghcr.io/1h-team
        run: node scripts/package-prepared.mjs --mac --arm64 --publish=never -c.mac.identity=null -c.mac.notarize=false -c.dmg.sign=false
      - name: Check Cursor SDK native artifacts
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          test -n "$APP_PATH" || { echo "Error: .app not found under $APP_DIR"; ls -la packages/electron/dist/; exit 1; }
          CURSOR="$APP_PATH/Contents/Resources/app.asar.unpacked/node_modules/@cursor/sdk-darwin-arm64"
          for file in "$CURSOR/bin/rg" "$CURSOR/bin/cursorsandbox"; do
            test -x "$file" || { echo "Error: executable Cursor SDK artifact missing: $file"; exit 1; }
          done
          for file in "$CURSOR/vendor/tree-sitter/binding.node" "$CURSOR/vendor/tree-sitter-bash/binding.node"; do
            test -f "$file" || { echo "Error: Cursor SDK native binding missing: $file"; exit 1; }
          done
      - name: Check packaged orchestration config
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          EXTRACT_ROOT="$RUNNER_TEMP/devryan-electron-asar"
          rm -rf "$EXTRACT_ROOT"
          ASAR_CLI=$(find node_modules/.bun -path '*/@electron+asar@*/node_modules/@electron/asar/bin/asar.js' -print -quit)
          test -n "$ASAR_CLI" || { echo "Error: installed Electron asar CLI not found in the Bun dependency tree."; exit 1; }
          node "$ASAR_CLI" extract "$APP_PATH/Contents/Resources/app.asar" "$EXTRACT_ROOT"
          ARTIFACT_ROOT="$EXTRACT_ROOT/node_modules/@devryan/web/server/default-config"
          node scripts/verify-default-config-artifact.mjs --source packages/web/server/default-config --artifact-root "$ARTIFACT_ROOT"
          node scripts/smoke-packaged-orchestration-config.mjs --config-root "$ARTIFACT_ROOT"
      - name: Check packaged Bot runtime manifest
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          PACKAGED="$APP_PATH/Contents/Resources/bot-runtime/images.release.json"
          cmp "$RUNNER_TEMP/bot-runtime-images/DevRyan-bot-runtime-images-${VERSION}.json" "$PACKAGED"
          node scripts/verify-bot-runtime-images.mjs --manifest "$PACKAGED" --version "$VERSION" --revision "$GITHUB_SHA" --repository-prefix ghcr.io/1h-team
      - name: Check macOS usage descriptions
        run: |
          set -euo pipefail
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          for key in NSAppleEventsUsageDescription NSDesktopFolderUsageDescription NSDocumentsFolderUsageDescription NSDownloadsFolderUsageDescription; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true)
            test -n "$value" || { echo "Error: required Info.plist usage description missing: $key"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: packages/electron/dist/DevRyan-${{ needs.admit.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  upgrade-check:
    concurrency:
      group: release-build-${{ github.ref_name }}-upgrade-check
      cancel-in-progress: true
    # Installed apps upgrade at their first launch. One job runs every required
    # lane at once (aging through the newest three releases, direct v2.0.2 and
    # direct v2.0.15), each with its own private profile and report, against one
    # extracted candidate runtime. One runner instead of three: the matrix
    # queued for scarce macOS runners (v2.1.6: the third lane waited 10 minutes).
    needs: [admit, electron-package]
    if: ${{ !cancelled() && needs.electron-package.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: candidate-dmg
      - name: Extract the packaged candidate runtime
        run: |
          set -euo pipefail
          MOUNT="$RUNNER_TEMP/candidate-mount"
          mkdir -p "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "candidate-dmg/DevRyan-${VERSION}-arm64.dmg"
          ditto "$MOUNT/DevRyan.app/Contents/Resources/revert-runtime/darwin-arm64" "$RUNNER_TEMP/candidate-runtime"
          hdiutil detach "$MOUNT" -force
      - name: Upgrade from the previous releases
        run: node scripts/qa/release-upgrade-lanes.mjs --candidate-artifacts "$RUNNER_TEMP/candidate-runtime" --report-dir "$RUNNER_TEMP/release-reports"
      - name: Export incomplete qualification reports if setup failed
        if: ${{ always() }}
        run: node scripts/qa/release-upgrade-lanes.mjs --report-dir "$RUNNER_TEMP/release-reports" --fallback-reports
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-upgrade
          path: ${{ runner.temp }}/release-reports/
          if-no-files-found: warn
          retention-days: 14

  final-dmg-smoke:
    concurrency:
      group: release-build-${{ github.ref_name }}-final-dmg-smoke
      cancel-in-progress: true
    needs: [admit, electron-package]
    if: ${{ !cancelled() && needs.electron-package.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 12
    # Enable only after reviewing three distinct qualified-run reports/screenshots.
    continue-on-error: ${{ vars.DEVRYAN_FINAL_DMG_SMOKE_GATE != 'qualified-3-runs' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install smoke dependencies
        env:
          DEVRYAN_SKIP_INSTALL_PREPARE: '1'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: candidate-dmg
      - name: Observe the unchanged final DMG first launch
        run: node scripts/qa/release-final-dmg-smoke.mjs --dmg "$PWD/candidate-dmg/DevRyan-${{ needs.admit.outputs.version }}-arm64.dmg" --report "$RUNNER_TEMP/release-smoke/report.json"
      - name: Export an incomplete qualification report if setup failed
        if: ${{ always() }}
        env:
          REPORT_PATH: ${{ runner.temp }}/release-smoke/report.json
          REPORT_KIND: release-final-dmg-smoke
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const file = process.env.REPORT_PATH;
          if (!await fs.stat(file).catch(() => null)) {
            await fs.mkdir(path.dirname(file), { recursive: true });
            await fs.writeFile(file, JSON.stringify({ schemaVersion: 1, kind: process.env.REPORT_KIND,
              sourceRevision: process.env.GITHUB_SHA, runID: process.env.GITHUB_RUN_ID,
              passed: false, failures: ['Qualification did not complete; inspect the failed setup step'] }) + '\n');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-final-dmg-smoke
          path: ${{ runner.temp }}/release-smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    concurrency:
      group: devryan-production-publication
      cancel-in-progress: false
    needs: [admit, electron-package, upgrade-check, final-dmg-smoke]
    if: ${{ !cancelled() && needs.electron-package.result == 'success' && needs.upgrade-check.result == 'success' && (needs.final-dmg-smoke.result == 'success' || vars.DEVRYAN_FINAL_DMG_SMOKE_GATE != 'qualified-3-runs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DevRyan Secrets
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.admit.outputs.release_id }}
      RELEASE_ASSET_DIRECTORY: release-assets
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: DevRyan-macos-arm64-release
          path: release-assets
      - name: Check the DMG and attach it to the draft
        id: upload
        run: node scripts/release.mjs upload
      - name: Setup Supabase CLI
        if: ${{ github.event_name == 'push' && steps.upload.outputs.published != 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Deploy and verify Supabase configuration and migrations
        if: ${{ github.event_name == 'push' && steps.upload.outputs.published != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Error: required release secret ${name} is not configured."
              exit 1
            fi
          done
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          node scripts/sync-supabase-auth-password-policy.mjs
          supabase db push --linked --dry-run
          supabase db push --linked --yes
          MIGRATION_STATUS_PATH="${RUNNER_TEMP}/supabase-migrations.json"
          SCHEMA_STATUS_PATH="${RUNNER_TEMP}/supabase-bot-schema.json"
          supabase migration list --linked --output-format json > "$MIGRATION_STATUS_PATH"
          supabase db query --linked --agent=no --output json \
            "select public.devryan_bot_schema_version() as schema_version;" \
            > "$SCHEMA_STATUS_PATH"
          MIGRATION_STATUS_PATH="$MIGRATION_STATUS_PATH" SCHEMA_STATUS_PATH="$SCHEMA_STATUS_PATH" node - <<'NODE'
          const fs = require('fs');
          const migrations = JSON.parse(fs.readFileSync(process.env.MIGRATION_STATUS_PATH, 'utf8'));
          const drift = (migrations.migrations || []).filter((entry) => !entry.local || !entry.remote || entry.local !== entry.remote);
          if (drift.length > 0) throw new Error(`Supabase migration history diverged for ${drift.length} migration(s).`);
          const source = fs.readFileSync('packages/web/server/lib/multi-user/auth-compat.js', 'utf8');
          const expected = source.match(/PRODUCTION_BOTS_MIGRATION = '(\d{14})'/)?.[1];
          const schema = JSON.parse(fs.readFileSync(process.env.SCHEMA_STATUS_PATH, 'utf8'));
          const actual = (Array.isArray(schema) ? schema : schema.rows)?.[0]?.schema_version;
          if (!expected || actual !== expected) {
            throw new Error(`Production Bot schema marker mismatch: expected ${expected || 'missing'}, received ${actual || 'missing'}.`);
          }
          NODE
      - name: Publish and confirm the in-app updater discovers the DMG
        if: ${{ github.event_name == 'push' }}
        run: node scripts/release.mjs publish
