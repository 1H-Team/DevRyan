# Every `bun test` run from the repository root (script Bun tests, CI
# per-file harness units, startup groups) first loads the test isolation guard
# (scripts/test-isolation-guard.mjs): it refuses a process whose HOME, XDG
# folders or DevRyan/OpenCode roots are not inside a private test root.
[test]
preload = ["./scripts/test-isolation-preload.mjs"]
