services:
  devryan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devryan
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Retain the existing host bind source so upgrades reuse its data.
      - ./data/openchamber:/home/devryan/.config/devryan
      - ./data/opencode/share:/home/devryan/.local/share/opencode
      - ./data/opencode/state:/home/devryan/.local/state/opencode
      - ./data/opencode/config:/home/devryan/.config/opencode
      - ./data/ssh:/home/devryan/.ssh
      - ./workspaces:/home/devryan/workspaces
    #environment:
    # DEVRYAN_HOST: 0.0.0.0  # Bind address (default in Docker: 0.0.0.0)
    # UI_PASSWORD: your_secure_password_here  # Uncomment to set UI password
    # DEVRYAN_TUNNEL_PROVIDER: cloudflare
    # DEVRYAN_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # DEVRYAN_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # DEVRYAN_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # DEVRYAN_TUNNEL_CONFIG: /home/devryan/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # DEVRYAN_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
