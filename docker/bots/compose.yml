services:
  supervisor:
    image: ${DEVRYAN_BOT_SUPERVISOR_IMAGE:?missing supervisor image}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    ports:
      - "127.0.0.1::43120"
    environment:
      DEVRYAN_BOT_SUPERVISOR_PORT: "43120"
      DEVRYAN_BOT_SUPERVISOR_TOKEN: ${DEVRYAN_BOT_SUPERVISOR_TOKEN:?missing supervisor token}
      DEVRYAN_BOT_ENGINE_PROXY_URL: http://engine-proxy:43124
      DEVRYAN_BOT_ENGINE_PROXY_TOKEN: ${DEVRYAN_BOT_ENGINE_PROXY_TOKEN:?missing engine proxy token}
    labels:
      devryan.runtime: production-bots
      devryan.owner: electron
      devryan.deployment: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
    # host_control is what makes the loopback-published supervisor port routable;
    # reasoning and computer are the internal networks it proxies runtime
    # traffic over, so neither container needs a published port of its own.
    networks:
      - management
      - host_control
      - reasoning
      - computer

  engine-proxy:
    image: ${DEVRYAN_BOT_ENGINE_PROXY_IMAGE:?missing engine proxy image}
    restart: unless-stopped
    user: "10001:10001"
    group_add:
      - ${DEVRYAN_DOCKER_SOCKET_GID:-0}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    environment:
      DEVRYAN_BOT_ENGINE_PROXY_PORT: "43124"
      DEVRYAN_BOT_ENGINE_PROXY_TOKEN: ${DEVRYAN_BOT_ENGINE_PROXY_TOKEN:?missing engine proxy token}
      DEVRYAN_BOT_DEPLOYMENT_ID: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
      DEVRYAN_BOT_HOST_RUNTIME_ROOT: ${DEVRYAN_BOT_HOST_RUNTIME_ROOT:?missing host runtime root}
      DEVRYAN_BOT_OPENCODE_IMAGE: ${DEVRYAN_BOT_OPENCODE_IMAGE:?missing OpenCode image}
      DEVRYAN_BOT_COMPUTER_IMAGE: ${DEVRYAN_BOT_COMPUTER_IMAGE:?missing computer image}
      DEVRYAN_BOT_REASONING_NETWORK: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-reasoning
      DEVRYAN_BOT_COMPUTER_NETWORK: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-computer
      DEVRYAN_MODEL_EGRESS_URL: http://egress:43121
    labels:
      devryan.runtime: production-bots
      devryan.owner: electron
      devryan.deployment: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
    expose:
      - "43124"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      management:
        aliases:
          - engine-proxy

  egress:
    image: ${DEVRYAN_BOT_EGRESS_IMAGE:?missing egress image}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    environment:
      DEVRYAN_BOT_EGRESS_PORT: "43121"
      DEVRYAN_BOT_EGRESS_SIGNING_KEY: ${DEVRYAN_BOT_EGRESS_SIGNING_KEY:?missing egress signing key}
      DEVRYAN_BOT_EGRESS_CONTROL_TOKEN: ${DEVRYAN_BOT_EGRESS_CONTROL_TOKEN:?missing egress control token}
      DEVRYAN_BOT_DEPLOYMENT_ID: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
      DEVRYAN_BOT_ACTIVE_REVISIONS: ${DEVRYAN_BOT_ACTIVE_REVISIONS:-}
    # The relay to the private gateway on the host loopback is the only reason
    # any Bot traffic still reaches the host; Electron pushes the address on the
    # control channel and no container may supply one.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      devryan.runtime: production-bots
      devryan.owner: electron
      devryan.deployment: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
    expose:
      - "43121"
    ports:
      - "127.0.0.1::43121"
    networks:
      reasoning:
        aliases:
          - egress
      computer:
        aliases:
          - egress
      egress_public:

  indexer:
    image: ${DEVRYAN_BOT_INDEXER_IMAGE:?missing indexer image}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.00
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    ports:
      - "127.0.0.1::43123"
    environment:
      DEVRYAN_BOT_INDEXER_PORT: "43123"
      DEVRYAN_BOT_INDEXER_TOKEN: ${DEVRYAN_BOT_INDEXER_TOKEN:?missing indexer token}
      DEVRYAN_BOT_INDEX_PATH: /var/lib/devryan-bot-index/index.sqlite
      DEVRYAN_BOT_MODEL_CACHE: /opt/devryan/model-cache
      DEVRYAN_BOT_MODEL_MANIFEST: /opt/devryan/model-cache-manifest.json
    labels:
      devryan.runtime: production-bots
      devryan.owner: electron
      devryan.deployment: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
    volumes:
      - bot-index:/var/lib/devryan-bot-index
    networks:
      - management
      - host_control

  # The local Bot catalog. PostgreSQL has no network at all: only the REST
  # service shares its socket volume, and peer authentication admits that
  # container's OS user as authenticator for the live database alone. The host
  # lifecycle owns initialization (a one-off `--initialize-only` run after it
  # has verified the data volume), migration, backup and replacement.
  database:
    image: ${DEVRYAN_BOT_DATABASE_IMAGE:?missing database image}
    restart: unless-stopped
    user: "999:999"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    shm_size: 128m
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    environment:
      DEVRYAN_BOT_DATABASE_INITIALIZE: refuse
    labels:
      devryan.runtime: production-bots
      devryan.owner: electron
      devryan.deployment: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
    volumes:
      - bot-database-data:/var/lib/postgresql/data
      - bot-database-socket:/var/run/postgresql

  # Loopback-only REST over the private socket. It has no anonymous role and
  # accepts only short-lived host-minted service tokens for its audience.
  database-rest:
    image: ${DEVRYAN_BOT_REST_IMAGE:?missing REST image}
    restart: unless-stopped
    user: "65534:65534"
    group_add:
      - "999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql:///devryan_bots?host=/var/run/postgresql&user=authenticator
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: extensions
      PGRST_DB_POOL: "10"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_JWT_SECRET: ${DEVRYAN_BOT_DATABASE_JWT_SECRET:?missing database token secret}
      PGRST_JWT_AUD: devryan-bots-local
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_HOST: "127.0.0.1"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_OPENAPI_MODE: disabled
      PGRST_LOG_LEVEL: error
    labels:
      devryan.runtime: production-bots
      devryan.owner: electron
      devryan.deployment: ${DEVRYAN_BOT_DEPLOYMENT_ID:?missing deployment id}
    ports:
      - "127.0.0.1::3000"
    volumes:
      - bot-database-socket:/var/run/postgresql:ro
    networks:
      - database_host

# Every named resource derives from DEVRYAN_BOT_RESOURCE_NAMESPACE (default
# `devryan`). Tests and release smoke set a unique namespace and refuse to
# mutate anything that resolves to a production name.
volumes:
  bot-runtime-state:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bot-runtime-state
  bot-index:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bot-index
  # Created and ownership-checked by the host before PostgreSQL starts; Compose
  # never creates an empty database volume on its own.
  bot-database-data:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bot-database-data
    external: true
  bot-database-socket:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bot-database-socket
    labels:
      devryan.runtime: production-bots
      devryan.volume-role: database-socket

networks:
  # Docker refuses to publish a host port for a container attached only to
  # internal networks, so the first-party services that publish a loopback port
  # (supervisor, indexer) hold this bridge. Reasoning and computer containers
  # never join it: they reach the private gateway through the egress relay and
  # are reached back through the supervisor's runtime proxy, so no container
  # running Bot-authored work has a route off its internal network.
  # It must stay masqueraded: Docker Desktop routes replies only to the VM's own
  # address, so a no-masquerade bridge silently loses host reachability after
  # the VM restarts. bot-runtime-manager.mjs recreates a bridge that still
  # carries the retired no-masquerade policy, and detaches containers that still
  # hold a retired attachment.
  host_control:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-host-control
    driver: bridge
    labels:
      devryan.runtime: production-bots
      devryan.network-policy: host-gateway-bridge
  management:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-management
    internal: true
    labels:
      devryan.runtime: production-bots
      devryan.network-policy: management-internal
  reasoning:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-reasoning
    internal: true
    labels:
      devryan.runtime: production-bots
      devryan.network-policy: model-egress-only
  computer:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-computer
    internal: true
    labels:
      devryan.runtime: production-bots
      devryan.network-policy: browser-egress-only
  egress_public:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-egress-public
    driver: bridge
    labels:
      devryan.runtime: production-bots
      devryan.network-policy: public-egress-service-only
  # Docker Desktop forwards the loopback REST port only from a non-internal
  # bridge. Only the REST service joins it; no Bot-authored container can.
  database_host:
    name: ${DEVRYAN_BOT_RESOURCE_NAMESPACE:-devryan}-bots-database-host
    driver: bridge
    labels:
      devryan.runtime: production-bots
      devryan.network-policy: database-rest-host-only
